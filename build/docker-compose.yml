# compose file to test mount built container

version: "2"
services:
  kronos:
    image: shukriadams/krono:latest
    container_name: krono_test
    restart: unless-stopped
    #command: /bin/sh -c  "while true ;sleep 5; do continue; done"
    volumes:
    - ./settings.yml:/opt/krono/settings.yml
    - ./logs:/var/log/krono:rw
